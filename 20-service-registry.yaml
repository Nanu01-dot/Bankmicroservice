apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-registry
  namespace: bank
  labels: { app: service-registry }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: service-registry }
  template:
    metadata:
      labels: { app: service-registry }
    spec:
      containers:
        - name: service-registry
          image: __IMAGE_PREFIX__/bank-service-registry:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
          env:
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 512Mi }
          readinessProbe:
            tcpSocket: { port: 8761 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8761 }
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: service-registry
  namespace: bank
  labels: { app: service-registry }
spec:
  type: ClusterIP
  selector: { app: service-registry }
  ports:
    - port: 8761
      targetPort: 8761
